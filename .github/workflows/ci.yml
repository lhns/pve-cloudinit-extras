name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .deb (Debian 13), lintian, contents
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential debhelper lintian >/dev/null
      - name: dpkg-buildpackage
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir dist && mv ../*.deb dist/
      - name: lintian
        run: lintian --fail-on error,warning --info --display-info dist/*.deb
      - name: dpkg-deb --contents sanity
        run: sh tests/deb-contents.sh dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  perl:
    name: Endpoint and generator unit tests (Perl)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: Install libpve-common-perl from the Proxmox repository
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
          curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg -o /usr/share/keyrings/proxmox-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pve trixie pve-no-subscription" > /etc/apt/sources.list.d/pve.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libpve-common-perl libjson-perl python3-yaml >/dev/null
      - name: perl -c
        run: |
          perl -c src/sbin/pve-cloudinit-extras-patch
          perl -Isrc/perl -It/lib -c src/perl/PVE/API2/CloudinitExtras.pm
      - run: prove -v t/

  lifecycle:
    name: dpkg lifecycle against real pve-manager .debs
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: deb
          path: dist
      - run: bash tests/lifecycle.sh dist/*.deb

  js:
    name: JS lint and headless GUI test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: sh fetch-libs.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test gui.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test-results
          path: tests/js/test-results

  e2e:
    name: End-to-end on nested Proxmox VE 9.2
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: deb
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || cat /sys/module/kvm_amd/parameters/nested
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils netpbm >/dev/null
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright
        working-directory: tests/js
        run: npm ci && npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/e2e/iso
          key: pve-iso-9.2-1
      - name: Run
        run: bash tests/e2e/run.sh dist/*.deb
      - name: Convert screenshots
        if: always()
        run: for f in ~/e2e/artifacts/*.ppm; do [ -f "$f" ] && pnmtopng "$f" > "${f%.ppm}.png" && rm "$f"; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            ~/e2e/artifacts
            tests/js/test-results

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  apt-repo:
    name: Build signed flat apt repository
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: deb
          path: dist
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends apt-utils gpg gpg-agent gpgv >/dev/null
      # The real key signs only on main and tags; PRs get a throwaway key. A tag never
      # publishes without the real key, nor with one that differs from keys/.
      - name: Import signing key
        id: key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          TRUSTED: ${{ github.event_name != 'pull_request' }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$TRUSTED" = true ] && [ -n "$APT_SIGNING_KEY" ]; then
            printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
            REAL=true
          elif [ "$TAG" = true ]; then
            echo "::error::secret APT_SIGNING_KEY is not set; refusing to publish unsigned"; exit 1
          else
            echo "::warning::signing with a throwaway key (PR, or APT_SIGNING_KEY not set)"
            gpg --batch --passphrase '' --quick-gen-key "throwaway CI test key" ed25519 sign 1d
            REAL=false
          fi
          [ "$(gpg --list-secret-keys --with-colons | grep -c '^sec')" = 1 ] || { echo "::error::expected exactly one secret key"; exit 1; }
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "signing key $FPR"
          echo "fpr=$FPR" >> "$GITHUB_OUTPUT"
          if [ "$REAL" = true ]; then
            if [ -f keys/pve-cloudinit-extras.asc ]; then
              COMMITTED=$(gpg --show-keys --with-colons keys/pve-cloudinit-extras.asc | awk -F: '/^fpr/{print $10; exit}')
              [ "$COMMITTED" = "$FPR" ] || { echo "::error::keys/pve-cloudinit-extras.asc is $COMMITTED, the secret is $FPR"; exit 1; }
            elif [ "$TAG" = true ]; then
              echo "::error::keys/pve-cloudinit-extras.asc is missing"; exit 1
            fi
          fi
      - run: sh ci/build-apt-repo.sh repo "${{ steps.key.outputs.fpr }}" dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: repo

  apt-test:
    name: apt install from the flat repository (Debian 13)
    needs: apt-repo
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apt-repo
          path: repo
      - run: sh tests/apt-repo.sh local repo

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, perl, lifecycle, js, e2e, actionlint, apt-repo, apt-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apt-repo
          path: repo
      - name: Tag matches package version
        run: |
          V=$(dpkg-deb -f repo/*.deb Version)
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::tag $GITHUB_REF_NAME, package $V"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" repo/* --repo "$GITHUB_REPOSITORY" --latest \
            --title "$GITHUB_REF_NAME" --notes "Built and tested by CI run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. See README for install instructions."

  apt-smoke:
    name: apt install from the published release
    needs: release
    uses: ./.github/workflows/apt-smoke.yml
    with:
      version: ${{ github.ref_name }}
